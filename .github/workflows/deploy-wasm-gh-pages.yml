# Builds the Compose Multiplatform wasmJs browser distribution and deploys it to
# GitHub Pages via the official Actions flow (no gh-pages branch).
#
# Repository settings: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy WASM to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/deploy-wasm-gh-pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle User Home (dependencies, wrapper dists, local build-cache) between runs.
      # Meaningful build-cache reuse needs org.gradle.caching=true in gradle.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasm browser distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
