kotlin.code.style=official
# If :composeApp:run fails with IllegalArgumentException during JavaVersion.parse (e.g. "25.0.2"),
# a stale Kotlin compiler daemon may be running on an unsupported JDK — run ./gradlew --stop or
# kotlin.compiler.execution.strategy=in-process below. Also ensure Gradle's JVM is JDK 21+ LTS.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Compile in the Gradle process JVM (avoids a long-lived Kotlin daemon pinned to another JDK).
kotlin.compiler.execution.strategy=in-process
# Reuse compilation / task outputs in CI (GitHub Actions caches ~/.gradle including build-cache).
org.gradle.caching=true
org.jetbrains.compose.experimental.wasm.enabled=true
